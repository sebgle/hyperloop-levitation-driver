<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
<style>
  .w{stroke:#111;stroke-width:2.4;fill:none;stroke-linecap:round}
  .rail{stroke:#111;stroke-width:3.2;fill:none;stroke-linecap:round}
  .plate{stroke:#111;stroke-width:4;fill:none;stroke-linecap:round}
  .exist{stroke:#9aa0a6;stroke-width:2.4;fill:none;stroke-linecap:round}
  .lbl{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:14px;fill:#111}
  .bold{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:15px;fill:#111;font-weight:600}
  .gray{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:13px;fill:#8a8f94}
  .note{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:13px;fill:#b45309}
  .num{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:12px;fill:#fff;font-weight:700}
</style>
<rect width="1000" height="580" fill="#fcfcfa"/>

<!-- ===== existing +60V rail ===== -->
<line class="rail" x1="60" y1="55" x2="940" y2="55"/>
<text class="bold" x="60" y="42">+60 V rail</text>
<text class="gray" x="700" y="42">(to Q1 and Q3 drains)</text>

<!-- ===== existing coil wire ===== -->
<line class="exist" x1="60" y1="150" x2="940" y2="150"/>
<text class="gray" x="560" y="142">SWA — SHUNT — COIL — SWB   (your existing wire)</text>

<!-- ===== the drop, with hop-over ===== -->
<path class="w" d="M150,55 L150,138"/>
<path class="w" d="M150,138 A 12,12 0 0 1 150,162"/>
<path class="w" d="M150,162 L150,250"/>
<text class="note" x="185" y="96">① one drop from the +60 V rail,</text>
<text class="note" x="185" y="113">with a hop-over where it</text>
<text class="note" x="185" y="130">crosses the coil wire</text>

<!-- ===== local +60V bus ===== -->
<line class="rail" x1="150" y1="250" x2="880" y2="250"/>
<text class="note" x="600" y="240">② turn right — local +60 V bus</text>

<!-- ===== GND rail ===== -->
<line class="rail" x1="60" y1="460" x2="940" y2="460"/>
<text class="bold" x="60" y="484">GND rail</text>
<text class="gray" x="700" y="484">(to Q2 and Q4 sources)</text>

<text class="note" x="300" y="512">③ hang all 7 symbols in the gap</text>

<!-- ============ 1: ceramic 2u2 x3 ============ -->
<line class="w" x1="215" y1="250" x2="215" y2="322"/>
<line class="plate" x1="192" y1="322" x2="238" y2="322"/>
<line class="plate" x1="192" y1="344" x2="238" y2="344"/>
<line class="w" x1="215" y1="344" x2="215" y2="460"/>
<circle cx="215" cy="205" r="12" fill="#111"/><text class="num" x="211" y="210">1</text>
<text class="lbl" x="215" y="386" text-anchor="middle">2.2 µF</text>
<text class="lbl" x="215" y="403" text-anchor="middle">×3</text>
<text class="gray" x="215" y="420" text-anchor="middle">ceramic</text>

<!-- ============ 2: ceramic 100n ============ -->
<line class="w" x1="325" y1="250" x2="325" y2="322"/>
<line class="plate" x1="302" y1="322" x2="348" y2="322"/>
<line class="plate" x1="302" y1="344" x2="348" y2="344"/>
<line class="w" x1="325" y1="344" x2="325" y2="460"/>
<circle cx="325" cy="205" r="12" fill="#111"/><text class="num" x="321" y="210">2</text>
<text class="lbl" x="325" y="386" text-anchor="middle">100 nF</text>
<text class="gray" x="325" y="403" text-anchor="middle">ceramic</text>

<!-- ============ 3: electrolytic 470u ============ -->
<line class="w" x1="435" y1="250" x2="435" y2="320"/>
<line class="plate" x1="412" y1="320" x2="458" y2="320"/>
<path class="plate" d="M412,340 Q435,358 458,340"/>
<line class="w" x1="435" y1="349" x2="435" y2="460"/>
<text class="bold" x="466" y="318">+</text>
<circle cx="435" cy="205" r="12" fill="#111"/><text class="num" x="431" y="210">3</text>
<text class="lbl" x="435" y="386" text-anchor="middle">470 µF</text>
<text class="gray" x="435" y="403" text-anchor="middle">electrolytic</text>

<!-- ============ 4: electrolytic 470u ============ -->
<line class="w" x1="545" y1="250" x2="545" y2="320"/>
<line class="plate" x1="522" y1="320" x2="568" y2="320"/>
<path class="plate" d="M522,340 Q545,358 568,340"/>
<line class="w" x1="545" y1="349" x2="545" y2="460"/>
<text class="bold" x="576" y="318">+</text>
<circle cx="545" cy="205" r="12" fill="#111"/><text class="num" x="541" y="210">4</text>
<text class="lbl" x="545" y="386" text-anchor="middle">470 µF</text>
<text class="gray" x="545" y="403" text-anchor="middle">electrolytic</text>

<!-- ============ 5: TVS ============ -->
<line class="w" x1="655" y1="250" x2="655" y2="318"/>
<!-- cathode bar with zener ticks -->
<line class="plate" x1="629" y1="318" x2="681" y2="318"/>
<line class="plate" x1="629" y1="318" x2="629" y2="307"/>
<line class="plate" x1="681" y1="318" x2="681" y2="329"/>
<!-- triangle pointing UP toward the bar -->
<path class="plate" d="M655,319 L634,351 L676,351 Z" fill="none" stroke-linejoin="round"/>
<line class="w" x1="655" y1="351" x2="655" y2="460"/>
<circle cx="655" cy="205" r="12" fill="#111"/><text class="num" x="651" y="210">5</text>
<text class="lbl" x="655" y="386" text-anchor="middle">TVS</text>
<text class="gray" x="655" y="403" text-anchor="middle">5.0SMDJ70A</text>

<!-- ============ 6: ceramic 100n ============ -->
<line class="w" x1="765" y1="250" x2="765" y2="322"/>
<line class="plate" x1="742" y1="322" x2="788" y2="322"/>
<line class="plate" x1="742" y1="344" x2="788" y2="344"/>
<line class="w" x1="765" y1="344" x2="765" y2="460"/>
<circle cx="765" cy="205" r="12" fill="#111"/><text class="num" x="761" y="210">6</text>
<text class="lbl" x="765" y="386" text-anchor="middle">100 nF</text>
<text class="gray" x="765" y="403" text-anchor="middle">ceramic</text>

<!-- ============ 7: ceramic 2u2 x3 ============ -->
<line class="w" x1="875" y1="250" x2="875" y2="322"/>
<line class="plate" x1="852" y1="322" x2="898" y2="322"/>
<line class="plate" x1="852" y1="344" x2="898" y2="344"/>
<line class="w" x1="875" y1="344" x2="875" y2="460"/>
<line class="rail" x1="875" y1="250" x2="880" y2="250"/>
<circle cx="875" cy="205" r="12" fill="#111"/><text class="num" x="871" y="210">7</text>
<text class="lbl" x="875" y="386" text-anchor="middle">2.2 µF</text>
<text class="lbl" x="875" y="403" text-anchor="middle">×3</text>
<text class="gray" x="875" y="420" text-anchor="middle">ceramic</text>

<!-- ===== end annotations ===== -->
<text class="note" x="215" y="545" text-anchor="middle">closest to Q1 / Q2</text>
<text class="note" x="875" y="545" text-anchor="middle">closest to Q3 / Q4</text>
<text class="gray" x="545" y="545" text-anchor="middle">bulk + clamp near the +60 V entry</text>
<path class="w" d="M215,525 L215,532" stroke="#b45309"/>
<path class="w" d="M875,525 L875,532" stroke="#b45309"/>

<!-- polarity reminders -->
<text class="note" x="466" y="336">↑ straight plate up</text>
<text class="note" x="690" y="336">↑ cathode up</text>
</svg>
