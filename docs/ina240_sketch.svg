<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660">
<style>
  .w{stroke:#111;stroke-width:2.4;fill:none;stroke-linecap:round}
  .pw{stroke:#111;stroke-width:3.6;fill:none;stroke-linecap:round}
  .plate{stroke:#111;stroke-width:3.6;fill:none;stroke-linecap:round}
  .box{stroke:#111;stroke-width:2.6;fill:#fff}
  .lbl{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:14px;fill:#111}
  .pin{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:13px;fill:#111}
  .bold{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:15px;fill:#111;font-weight:600}
  .gray{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:12px;fill:#8a8f94}
  .note{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif;font-size:12.5px;fill:#b45309}
</style>
<rect width="1020" height="660" fill="#fcfcfa"/>

<!-- ===== power path ===== -->
<line class="pw" x1="55" y1="70" x2="200" y2="70"/>
<rect x="200" y="46" width="140" height="48" class="box"/>
<text class="bold" x="270" y="76" text-anchor="middle">SHUNT</text>
<text class="gray" x="200" y="28">1 mΩ, 4-terminal</text>
<line class="pw" x1="340" y1="70" x2="620" y2="70"/>
<text class="bold" x="55" y="52">SW_A</text>
<text class="bold" x="360" y="52">COIL_A</text>
<text class="gray" x="628" y="75">→ to connector → coil</text>

<!-- ===== kelvin sense taps ===== -->
<line class="w" x1="228" y1="94" x2="228" y2="150"/>
<line class="w" x1="312" y1="94" x2="312" y2="150"/>
<text class="note" x="392" y="128">Kelvin: tap the small SENSE pads,</text>
<text class="note" x="392" y="144">not the fat current pads</text>

<!-- 10 ohm resistors (zigzag) -->
<path class="w" d="M228,150 l0,8 l-9,6 l18,10 l-18,10 l18,10 l-9,6 l0,8"/>
<path class="w" d="M312,150 l0,8 l-9,6 l18,10 l-18,10 l18,10 l-9,6 l0,8"/>
<text class="lbl" x="196" y="200" text-anchor="end">10 Ω</text>
<text class="lbl" x="344" y="200">10 Ω</text>
<line class="w" x1="228" y1="208" x2="228" y2="255"/>
<line class="w" x1="312" y1="208" x2="312" y2="255"/>

<!-- 1nF differential cap -->
<line class="w" x1="228" y1="255" x2="255" y2="255"/>
<line class="plate" x1="255" y1="237" x2="255" y2="273"/>
<line class="plate" x1="272" y1="237" x2="272" y2="273"/>
<line class="w" x1="272" y1="255" x2="312" y2="255"/>
<text class="lbl" x="270" y="296" text-anchor="middle">1 nF</text>

<!-- down into chip -->
<line class="w" x1="228" y1="255" x2="228" y2="350"/>
<line class="w" x1="228" y1="350" x2="380" y2="350"/>
<line class="w" x1="312" y1="255" x2="312" y2="410"/>
<line class="w" x1="312" y1="410" x2="380" y2="410"/>

<!-- ===== the chip ===== -->
<rect x="380" y="310" width="270" height="170" class="box"/>
<text class="bold" x="515" y="365" text-anchor="middle">INA240A1</text>
<text class="gray" x="515" y="386" text-anchor="middle">gain ×20</text>

<text class="pin" x="390" y="345">IN+ (8)</text>
<text class="pin" x="390" y="415">IN− (1)</text>
<text class="pin" x="640" y="345" text-anchor="end">(5) OUT</text>
<text class="pin" x="418" y="303">VS (6)</text>
<text class="pin" x="565" y="303">NC (4)</text>
<text class="pin" x="398" y="498">GND (2)</text>
<text class="pin" x="486" y="498">REF1 (7)</text>
<text class="pin" x="572" y="498">REF2 (3)</text>

<!-- OUT -->
<line class="w" x1="650" y1="350" x2="760" y2="350"/>
<path class="w" d="M752,344 l10,6 l-10,6"/>
<text class="bold" x="768" y="355">ISNS</text>
<text class="gray" x="768" y="374">→ connector + OCP</text>

<!-- VS up to 3v3 -->
<line class="w" x1="415" y1="310" x2="415" y2="245"/>
<line class="pw" x1="415" y1="245" x2="880" y2="245"/>
<line class="w" x1="880" y1="245" x2="880" y2="222"/>
<line class="pw" x1="855" y1="222" x2="905" y2="222"/>
<text class="bold" x="912" y="227">+3.3 V</text>

<!-- NC stub -->
<line class="w" x1="585" y1="310" x2="585" y2="272"/>
<line class="w" x1="577" y1="264" x2="593" y2="280"/>
<line class="w" x1="593" y1="264" x2="577" y2="280"/>
<text class="note" x="604" y="277">leave open</text>

<!-- GND pin -->
<line class="w" x1="415" y1="480" x2="415" y2="545"/>
<path class="w" d="M398,545 L432,545 L415,566 Z" fill="none"/>

<!-- REF1 to GND -->
<line class="w" x1="503" y1="480" x2="503" y2="545"/>
<path class="w" d="M486,545 L520,545 L503,566 Z" fill="none"/>

<!-- REF2 to 3v3, as a net label -->
<line class="w" x1="590" y1="480" x2="590" y2="530"/>
<line class="pw" x1="568" y1="530" x2="612" y2="530"/>
<text class="bold" x="622" y="535">+3.3 V</text>

<!-- decoupling -->
<line class="w" x1="810" y1="245" x2="810" y2="400"/>
<circle cx="810" cy="245" r="4.5" fill="#111"/>
<line class="plate" x1="790" y1="400" x2="830" y2="400"/>
<line class="plate" x1="790" y1="420" x2="830" y2="420"/>
<line class="w" x1="810" y1="420" x2="810" y2="470"/>
<path class="w" d="M793,470 L827,470 L810,491 Z" fill="none"/>
<text class="lbl" x="840" y="416">100 nF</text>
<text class="gray" x="840" y="434">at the chip</text>

<!-- notes -->
<text class="note" x="55" y="230">≤ 10 Ω — bigger</text>
<text class="note" x="55" y="246">causes gain error</text>

<text class="note" x="55" y="612">REF1 → GND and REF2 → +3.3 V puts zero current at 1.65 V out.</text>
<text class="note" x="55" y="632">+30 A → 2.25 V   ·   0 A → 1.65 V   ·   −30 A → 1.05 V   ·   full scale ≈ ±80 A</text>
</svg>
